name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build release archives
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Dev-only paths, irrelevant to running the app. Full source (incl.
          # tests/docs) is always available via GitHub's automatic per-tag
          # "Source code" archive, so nothing is lost by trimming these here.
          COMMON_EXCLUDES="tests docs .github CLAUDE.md pytest.ini .gitignore handoff.md benchmark_models.py"
          for OS in windows macos linux; do
            case "$OS" in
              windows) OS_EXCLUDES="start_mac.sh start_linux.sh" ;;
              macos)   OS_EXCLUDES="start.bat start.ps1 start_linux.sh" ;;
              linux)   OS_EXCLUDES="start.bat start.ps1 start_mac.sh" ;;
            esac
            PATHSPECS=(".")
            for FILE in $COMMON_EXCLUDES $OS_EXCLUDES; do
              PATHSPECS+=(":(exclude)${FILE}")
            done
            git archive --format=zip --prefix="geo-assist-${VERSION}/" --output="geo-assist-${OS}-${VERSION}.zip" HEAD -- "${PATHSPECS[@]}"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            geo-assist-windows-${{ steps.version.outputs.version }}.zip
            geo-assist-macos-${{ steps.version.outputs.version }}.zip
            geo-assist-linux-${{ steps.version.outputs.version }}.zip
          generate_release_notes: true
