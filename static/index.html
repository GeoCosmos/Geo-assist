<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geo-Assist</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f8fafd;
  --surface: #ffffff;
  --sidebar-bg: #080c18;
  --sidebar-text: #b0bfd4;
  --sidebar-muted: #48607e;
  --accent: #0ea5e9;
  --accent-hover: #0284c7;
  --border: #dde4ef;
  --text: #0f172a;
  --text-muted: #64748b;
  --bubble-user: #0ea5e9;
  --bubble-assistant: #ffffff;
  --danger: #ef4444;
  --ok: #10b981;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 14px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b1120;
    --surface: #0e1a2e;
    --border: #1a2b42;
    --text: #dce6f5;
    --text-muted: #5e7a9a;
    --bubble-assistant: #111d30;
  }
}

html, body { height: 100%; overflow: hidden; background: var(--bg); }

#app { display: flex; height: 100vh; }

/* ── sidebar ── */
#sidebar {
  width: 240px;
  min-width: 240px;
  height: 100vh;
  background: linear-gradient(180deg, #0c1424 0%, #070b14 100%);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border-right: 1px solid rgba(14,165,233,.1);
}

.logo {
  padding: 16px 16px 13px;
  font-size: 15px;
  font-weight: 700;
  color: #e2eaf5;
  letter-spacing: .2px;
  border-bottom: 1px solid rgba(14,165,233,.12);
  display: flex;
  align-items: center;
  gap: 8px;
}
.logo-icon { font-size: 18px; }

#status-pill {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 9px 16px;
  font-size: 11.5px;
  color: var(--sidebar-muted);
  border-bottom: 1px solid rgba(14,165,233,.08);
}
#status-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--sidebar-muted);
  flex-shrink: 0;
}
#status-dot.ok  { background: var(--ok); box-shadow: 0 0 6px rgba(16,185,129,.5); }
#status-dot.bad { background: var(--danger); }

/* ── conversations section ── */
#conv-section {
  display: flex;
  flex-direction: column;
  flex: 1;
  overflow: hidden;
  min-height: 0;
}

#new-conv-btn {
  margin: 10px 12px 6px;
  padding: 8px 12px;
  background: rgba(14,165,233,.1);
  color: #38bdf8;
  border: 1px solid rgba(14,165,233,.18);
  border-radius: 8px;
  font-size: 12.5px;
  font-weight: 500;
  cursor: pointer;
  text-align: left;
  width: calc(100% - 24px);
  transition: background .15s, border-color .15s, color .15s;
  flex-shrink: 0;
}
#new-conv-btn:hover { background: rgba(14,165,233,.18); border-color: rgba(14,165,233,.35); color: #7dd3fc; }

#conv-list {
  flex: 1;
  overflow-y: auto;
  padding: 2px 0 4px;
}
#conv-list::-webkit-scrollbar { width: 3px; }
#conv-list::-webkit-scrollbar-track { background: transparent; }
#conv-list::-webkit-scrollbar-thumb { background: rgba(14,165,233,.2); border-radius: 99px; }

.conv-item {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 7px 10px 7px 16px;
  cursor: pointer;
  color: var(--sidebar-text);
  border-left: 2px solid transparent;
  transition: background .1s;
}
.conv-item:hover { background: rgba(255,255,255,.04); }
.conv-item.active { background: rgba(14,165,233,.1); border-left-color: #0ea5e9; }
.conv-meta { flex: 1; overflow: hidden; }
.conv-title {
  font-size: 12px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--sidebar-text);
}
.conv-item.active .conv-title { color: #38bdf8; }
.conv-time { font-size: 10px; color: var(--sidebar-muted); margin-top: 1px; }
.conv-del {
  width: 18px; height: 18px;
  border: none; background: none;
  color: #3a4f6a;
  cursor: pointer; font-size: 14px;
  border-radius: 3px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  opacity: 0;
  transition: opacity .1s, color .1s;
}
.conv-item:hover .conv-del { opacity: 1; }
.conv-del:hover { color: var(--danger); }
.conv-empty { padding: 10px 16px; color: #3a4f6a; font-size: 12px; }

/* ── documents section ── */
#doc-section {
  display: flex;
  flex-direction: column;
  border-top: 1px solid rgba(14,165,233,.1);
  flex-shrink: 0;
}

#upload-zone {
  margin: 10px 12px 4px;
  border: 1.5px dashed rgba(14,165,233,.25);
  border-radius: 8px;
  padding: 10px;
  text-align: center;
  color: var(--sidebar-muted);
  font-size: 12px;
  cursor: pointer;
  transition: border-color .15s, background .15s, color .15s;
  flex-shrink: 0;
}
#upload-zone:hover, #upload-zone.drag { border-color: #0ea5e9; background: rgba(14,165,233,.07); color: #38bdf8; }
#upload-zone input { display: none; }

#folder-input-row {
  display: flex;
  align-items: center;
  gap: 5px;
  margin: 2px 12px 4px;
  flex-shrink: 0;
}
#folder-input-row span { font-size: 12px; color: var(--sidebar-muted); flex-shrink: 0; }

/* NAS scan — hidden until /ingest/nas/health confirms a usable mount, so an
   install with no share attached never shows a button that only errors. */
#nas-row { display: none; margin: 0 12px 4px; flex-shrink: 0; }
#nas-btn {
  width: 100%;
  background: rgba(255,255,255,.04);
  border: 1px solid rgba(14,165,233,.18);
  border-radius: 6px;
  color: var(--sidebar-text);
  font-size: 11.5px;
  padding: 5px 8px;
  cursor: pointer;
  text-align: left;
  transition: border-color .15s, background .15s;
}
#nas-btn:hover { border-color: var(--accent); background: rgba(14,165,233,.08); }
#nas-panel { display: none; margin-top: 5px; }
#nas-subpath {
  width: 100%;
  background: rgba(255,255,255,.05);
  border: 1px solid rgba(14,165,233,.15);
  border-radius: 6px;
  color: var(--sidebar-text);
  font-size: 11.5px;
  padding: 4px 6px;
  outline: none;
}
#nas-actions { display: flex; gap: 5px; margin-top: 5px; }
#nas-actions button {
  flex: 1;
  background: rgba(255,255,255,.04);
  border: 1px solid rgba(14,165,233,.18);
  border-radius: 6px;
  color: var(--sidebar-text);
  font-size: 11px;
  padding: 4px 6px;
  cursor: pointer;
}
#nas-actions button:hover:not(:disabled) { border-color: var(--accent); }
#nas-actions button:disabled { opacity: .4; cursor: default; }
#nas-summary { font-size: 10.5px; color: var(--sidebar-muted); margin-top: 5px; line-height: 1.4; }
#folder-input {
  flex: 1;
  background: rgba(255,255,255,.05);
  border: 1px solid rgba(14,165,233,.15);
  border-radius: 6px;
  color: var(--sidebar-text);
  font-size: 11.5px;
  padding: 4px 8px;
  outline: none;
  transition: border-color .15s;
}
#folder-input:focus { border-color: rgba(14,165,233,.4); }

.section-label {
  padding: 5px 16px 3px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .9px;
  text-transform: uppercase;
  color: rgba(14,165,233,.45);
  flex-shrink: 0;
}

#scope-bar {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 12px 4px;
  font-size: 11px;
  color: var(--sidebar-muted);
  flex-shrink: 0;
}
#scope-btn {
  background: none;
  border: 1px solid rgba(14,165,233,.2);
  border-radius: 5px;
  color: #38bdf8;
  font-size: 11px;
  padding: 1px 7px;
  cursor: pointer;
  transition: background .12s, border-color .12s;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 120px;
}
#scope-btn:hover { background: rgba(14,165,233,.1); border-color: rgba(14,165,233,.4); }
#scope-btn.active { background: rgba(14,165,233,.15); border-color: #0ea5e9; color: #7dd3fc; }
#clear-all-btn {
  background: none;
  border: 1px solid rgba(239,68,68,.25);
  border-radius: 5px;
  color: rgba(239,68,68,.65);
  font-size: 11px;
  padding: 1px 7px;
  cursor: pointer;
  transition: background .12s, border-color .12s;
}
#clear-all-btn:hover { background: rgba(239,68,68,.08); border-color: rgba(239,68,68,.5); color: #f87171; }

#doc-list { overflow-y: auto; max-height: 140px; padding: 2px 0 6px; }
#doc-list::-webkit-scrollbar { width: 3px; }
#doc-list::-webkit-scrollbar-track { background: transparent; }
#doc-list::-webkit-scrollbar-thumb { background: rgba(14,165,233,.2); border-radius: 99px; }

.folder-group-header {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 4px 12px 3px 12px;
  font-size: 11px;
  font-weight: 600;
  color: var(--sidebar-muted);
  cursor: pointer;
  user-select: none;
  transition: color .12s;
}
.folder-group-header:hover { color: #38bdf8; }
.folder-group-header.scoped { color: #38bdf8; }
.folder-toggle { font-size: 9px; flex-shrink: 0; }
.folder-name-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.folder-count { font-size: 10px; opacity: .7; flex-shrink: 0; }

.doc-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 12px 5px 22px;
  color: var(--sidebar-text);
  font-size: 12px;
  cursor: default;
}
.doc-item:hover { background: rgba(255,255,255,.03); }
.doc-icon { font-size: 13px; flex-shrink: 0; }
.doc-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.doc-chunks { font-size: 10px; color: var(--sidebar-muted); flex-shrink: 0; }
.doc-del {
  width: 18px; height: 18px;
  border: none; background: none;
  color: #3a4f6a;
  cursor: pointer; font-size: 14px;
  border-radius: 3px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  opacity: 0;
  transition: opacity .1s, color .1s;
}
.doc-item:hover .doc-del { opacity: 1; }
.doc-del:hover { color: var(--danger); }
.doc-move {
  width: 18px; height: 18px;
  border: none; background: none;
  color: #3a4f6a;
  cursor: pointer; font-size: 11px;
  border-radius: 3px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  opacity: 0;
  transition: opacity .1s, color .1s;
}
.doc-item:hover .doc-move { opacity: 1; }
.doc-move:hover { color: #38bdf8; }

#progress-bar {
  display: none;
  margin: 0 12px 2px;
  height: 3px;
  background: rgba(14,165,233,.1);
  border-radius: 99px;
  overflow: hidden;
  flex-shrink: 0;
}
#progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #0ea5e9, #38bdf8); transition: width .3s; }
#ingest-label { padding: 0 12px 4px; font-size: 11px; color: var(--sidebar-muted); min-height: 16px; flex-shrink: 0; }

.toast {
  position: fixed;
  bottom: 24px; left: 50%;
  transform: translateX(-50%) translateY(12px);
  background: #0f172a; color: #e2eaf5;
  padding: 10px 22px;
  border-radius: 10px;
  font-size: 13px; font-weight: 500;
  opacity: 0;
  transition: opacity .25s, transform .25s;
  pointer-events: none;
  z-index: 1000;
  white-space: nowrap;
  box-shadow: 0 4px 20px rgba(0,0,0,.35);
}
.toast.show  { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.error { background: var(--danger); color: #fff; }

/* ── main ── */
#main { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }

#messages {
  flex: 1;
  overflow-y: auto;
  padding: 32px 24px 16px;
  display: flex;
  flex-direction: column;
  gap: 24px;
}
#messages::-webkit-scrollbar { width: 5px; }
#messages::-webkit-scrollbar-track { background: transparent; }
#messages::-webkit-scrollbar-thumb { background: rgba(0,0,0,.1); border-radius: 99px; }
@media (prefers-color-scheme: dark) { #messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,.08); } }

.msg-row { display: flex; flex-direction: column; max-width: 780px; width: 100%; }
.msg-row.user      { align-self: flex-end;  align-items: flex-end; }
.msg-row.assistant { align-self: flex-start; }

.msg-label {
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: .5px;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 5px;
  padding: 0 4px;
}

.bubble {
  padding: 13px 17px;
  border-radius: 16px;
  line-height: 1.65;
  word-break: break-word;
}
.msg-row.user .bubble {
  background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
  color: #fff;
  border-bottom-right-radius: 4px;
  white-space: pre-wrap;
  box-shadow: 0 2px 10px rgba(14,165,233,.28);
}
.msg-row.assistant .bubble {
  background: var(--bubble-assistant);
  color: var(--text);
  border: 1px solid var(--border);
  border-bottom-left-radius: 4px;
  white-space: pre-wrap;
  box-shadow: 0 1px 5px rgba(0,0,0,.06);
}

/* markdown elements inside assistant bubbles */
.bubble.md { white-space: normal; }
.bubble.md p  { margin: 0 0 .65em; }
.bubble.md p:last-child { margin-bottom: 0; }
.bubble.md h3, .bubble.md h4 { font-size: 14px; font-weight: 700; margin: .8em 0 .3em; }
.bubble.md ol, .bubble.md ul { padding-left: 20px; margin: .3em 0 .65em; }
.bubble.md li  { margin: .2em 0; line-height: 1.65; }
.bubble.md strong { font-weight: 600; }
.bubble.md em { font-style: italic; }
.bubble.md code {
  background: rgba(14,165,233,.1);
  color: #0284c7;
  padding: 1px 5px;
  border-radius: 3px;
  font-family: ui-monospace, "SFMono-Regular", monospace;
  font-size: 12.5px;
}
@media (prefers-color-scheme: dark) { .bubble.md code { background: rgba(14,165,233,.15); color: #38bdf8; } }
.bubble.md pre {
  background: #f1f5fb;
  border: 1px solid #dde4ef;
  padding: 12px 14px;
  border-radius: 9px;
  overflow-x: auto;
  margin: .4em 0 .7em;
}
@media (prefers-color-scheme: dark) { .bubble.md pre { background: #0a1628; border-color: #1a2b42; } }
.bubble.md pre code { background: none; padding: 0; color: var(--text); }
.bubble.md table { border-collapse: collapse; width: 100%; margin: .5em 0 .8em; font-size: 13px; }
.bubble.md th, .bubble.md td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
.bubble.md th { background: rgba(14,165,233,.07); font-weight: 600; color: var(--text); }
.bubble.md tr:nth-child(even) td { background: rgba(14,165,233,.03); }
@media (prefers-color-scheme: dark) {
  .bubble.md th { background: rgba(14,165,233,.1); }
  .bubble.md tr:nth-child(even) td { background: rgba(14,165,233,.05); }
}

.sources {
  margin-top: 9px;
  display: flex; flex-wrap: wrap; gap: 6px;
}
.source-chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 10px;
  background: rgba(14,165,233,.07);
  border: 1px solid rgba(14,165,233,.2);
  border-radius: 99px;
  font-size: 11px;
  color: #0ea5e9;
  text-decoration: none;
  transition: background .12s;
}
a.source-chip { cursor: pointer; }
a.source-chip:visited { color: #0ea5e9; }
.source-chip:hover { background: rgba(14,165,233,.14); }
.source-chip::before { content: "📄"; font-size: 10px; }

.empty-state {
  margin: auto;
  text-align: center;
  color: var(--text-muted);
  padding: 40px 20px;
  user-select: none;
}
.empty-state .es-logo { max-width: 260px; width: 100%; opacity: .92; margin-bottom: 18px; }
.empty-state .es-icon { font-size: 38px; margin-bottom: 14px; opacity: .6; }
.empty-state h2 { font-size: 22px; font-weight: 700; color: var(--text); margin-bottom: 8px; letter-spacing: -.3px; }
.empty-state p  { font-size: 13.5px; line-height: 1.75; max-width: 280px; margin: 0 auto; }
@media (prefers-color-scheme: dark) { .empty-state .es-logo { filter: invert(1) hue-rotate(180deg) brightness(1.1); } }

.thinking {
  display: flex; gap: 5px; align-items: center;
  padding: 13px 17px;
  background: var(--bubble-assistant);
  border: 1px solid var(--border);
  border-radius: 16px; border-bottom-left-radius: 4px;
  width: fit-content;
  box-shadow: 0 1px 5px rgba(0,0,0,.06);
}
.thinking span {
  width: 7px; height: 7px;
  background: #0ea5e9;
  border-radius: 50%;
  animation: blink 1.2s infinite;
}
.thinking span:nth-child(2) { animation-delay: .2s; }
.thinking span:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%,80%,100% { opacity:.15 } 40% { opacity:1 } }

/* ── input bar ── */
#input-bar {
  padding: 10px 20px 16px;
  border-top: 1px solid var(--border);
  background: var(--surface);
}
#input-wrap { position: relative; }
#question {
  width: 100%;
  padding: 12px 52px 12px 16px;
  border: 1.5px solid var(--border);
  border-radius: 14px;
  background: var(--bg); color: var(--text);
  font-size: 14px; font-family: inherit;
  resize: none; max-height: 140px; line-height: 1.5;
  outline: none;
  transition: border-color .15s, box-shadow .15s;
  display: block;
}
#question:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(14,165,233,.12); }
#send-btn {
  position: absolute;
  right: 8px; bottom: 7px;
  width: 34px; height: 34px;
  background: var(--accent); color: #fff;
  border: none; border-radius: 9px;
  font-size: 17px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background .15s, transform .1s, opacity .15s;
}
#send-btn:hover:not(:disabled) { background: var(--accent-hover); transform: scale(1.06); }
#send-btn:disabled { opacity: .35; cursor: not-allowed; transform: none; }

/* ── procedure mode ── */
#proc-bar {
  display: none;
  flex-direction: column;
  gap: 8px;
  padding: 10px 20px 12px;
  background: linear-gradient(135deg, rgba(14,165,233,.07), rgba(2,132,199,.04));
  border-bottom: 1px solid rgba(14,165,233,.18);
  flex-shrink: 0;
}
#proc-bar.active { display: flex; }
#proc-nav {
  display: flex;
  align-items: center;
  gap: 8px;
}
#proc-title {
  flex: 1;
  font-size: 12px;
  font-weight: 600;
  color: var(--accent);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#proc-step-counter {
  font-size: 11px;
  color: var(--text-muted);
  white-space: nowrap;
}
.proc-btn {
  padding: 4px 11px;
  font-size: 12px;
  border-radius: 7px;
  border: 1px solid rgba(14,165,233,.28);
  background: rgba(14,165,233,.09);
  color: var(--accent);
  cursor: pointer;
  white-space: nowrap;
  transition: background .12s;
}
.proc-btn:hover:not(:disabled) { background: rgba(14,165,233,.18); }
.proc-btn:disabled { opacity: .38; cursor: default; }
.proc-btn.danger {
  border-color: rgba(239,68,68,.28);
  background: rgba(239,68,68,.07);
  color: var(--danger);
}
.proc-btn.danger:hover { background: rgba(239,68,68,.16); }
#proc-step-box {
  background: var(--surface);
  border: 1px solid rgba(14,165,233,.14);
  border-radius: 9px;
  padding: 10px 14px;
  font-size: 13px;
  color: var(--text);
  line-height: 1.6;
  max-height: 130px;
  overflow-y: auto;
  white-space: pre-wrap;
}
#proc-step-box::-webkit-scrollbar { width: 3px; }
#proc-step-box::-webkit-scrollbar-thumb { background: rgba(14,165,233,.2); border-radius: 99px; }

.doc-proc {
  width: 18px; height: 18px;
  border: none; background: none;
  color: rgba(14,165,233,.5);
  cursor: pointer; font-size: 10px;
  border-radius: 3px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  opacity: 0;
  transition: opacity .1s, color .1s;
}
.doc-item:hover .doc-proc { opacity: 1; }
.doc-proc:hover { color: var(--accent); background: rgba(14,165,233,.1); }
</style>
</head>
<body>
<div id="app">
  <nav id="sidebar">
    <div class="logo"><span class="logo-icon">🛰</span>Geo-Assist</div>
    <div id="status-pill">
      <div id="status-dot"></div>
      <span id="status-text">Connecting…</span>
    </div>

    <div id="conv-section">
      <button id="new-conv-btn" onclick="newConversation()">＋ New conversation</button>
      <div class="section-label">Conversations</div>
      <div id="conv-list"><div class="conv-empty">No conversations yet</div></div>
    </div>

    <div id="doc-section">
      <label id="upload-zone">
        <input type="file" id="file-input" multiple>
        <div>⬆ Upload documents</div>

<div id="toast" class="toast"></div>

<script>
const API = '';

function _apiFetch(url, opts = {}) {
  return fetch(url, opts);
}

// ── health poll ───────────────────────────────────────────────────────────────
let _healthFailures = 0;
async function pollHealth() {
  try {
    const h = await _apiFetch(`${API}/health`).then(r => r.json());
    const dot  = document.getElementById('status-dot');
    const text = document.getElementById('status-text');
    if (h.ollama) {
      _healthFailures = 0;
      dot.className = 'ok';
      text.textContent = h.chat_model;
    } else {
      _healthFailures++;
      if (_healthFailures >= 2) { dot.className = 'bad'; text.textContent = 'Ollama not running'; }
    }
  } catch {
    _healthFailures++;
    if (_healthFailures >= 2) {
      document.getElementById('status-dot').className = 'bad';
      document.getElementById('status-text').textContent = 'Backend offline';
    }
  }
}
pollHealth();
setInterval(pollHealth, 8000);

// ── markdown renderer ─────────────────────────────────────────────────────────
function renderMarkdown(raw) {
  const lines = escHtml(raw).split('\n');
  const blocks = [];
  let i = 0;

  while (i < lines.length) {
    const line = lines[i];

    // Fenced code block
    if (line.startsWith('```')) {
      let code = '';
      i++;
      while (i < lines.length && !lines[i].startsWith('```')) { code += lines[i] + '\n'; i++; }
      blocks.push(`<pre><code>${code.trimEnd()}</code></pre>`);
      i++;
      continue;
    }

    // Heading (# ## ###)
    const hm = line.match(/^(#{1,3}) (.+)/);
    if (hm) {
      const level = Math.min(hm[1].length + 2, 6);
      blocks.push(`<h${level}>${inlineMd(hm[2])}</h${level}>`);
      i++;
      continue;
    }

    // Markdown table — collect consecutive pipe-delimited rows
    if (/^\|/.test(line)) {
      const tableLines = [];
      while (i < lines.length && /^\|/.test(lines[i])) {
        tableLines.push(lines[i]);
        i++;
      }
      // tableLines[0] = header, tableLines[1] = separator (---)
      if (tableLines.length >= 2) {
        const parseCells = row => row.split('|').slice(1, -1).map(c => inlineMd(c.trim()));
        const headers = parseCells(tableLines[0]);
        let html = '<table><thead><tr>' + headers.map(h => `<th>${h}</th>`).join('') + '</tr></thead><tbody>';
        for (let r = 2; r < tableLines.length; r++) {
          const cells = parseCells(tableLines[r]);
          html += '<tr>' + cells.map(c => `<td>${c}</td>`).join('') + '</tr>';
        }
        html += '</tbody></table>';
        blocks.push(html);
      }
      continue;
    }

    // Ordered list — collect consecutive items
    if (/^\d+\. /.test(line)) {
      const items = [];
      while (i < lines.length && /^\d+\. /.test(lines[i])) {
        items.push(`<li>${inlineMd(lines[i].replace(/^\d+\. /, ''))}</li>`);
        i++;
      }
      blocks.push(`<ol>${items.join('')}</ol>`);
      continue;
    }

    // Unordered list — collect consecutive items
    if (/^[*-] /.test(line)) {
      const items = [];
      while (i < lines.length && /^[*-] /.test(lines[i])) {
        items.push(`<li>${inlineMd(lines[i].replace(/^[*-] /, ''))}</li>`);
        i++;
      }
      blocks.push(`<ul>${items.join('')}</ul>`);
      continue;
    }

    // Blank line — skip
    if (!line.trim()) { i++; continue; }

    // Paragraph — collect until blank line or block-level marker
    const paraLines = [];
    while (
      i < lines.length &&
      lines[i].trim() &&
      !/^(#{1,3} |```|\d+\. |[*-] )/.test(lines[i])
    ) {
      paraLines.push(inlineMd(lines[i]));
      i++;
    }
    if (paraLines.length) blocks.push(`<p>${paraLines.join('<br>')}</p>`);
  }

  return blocks.join('');
}

function inlineMd(text) {
  return text
    .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\*([^*\n]+)\*/g,     '<em>$1</em>')
    .replace(/`([^`\n]+)`/g,       '<code>$1</code>');
}

// ── documents ─────────────────────────────────────────────────────────────────
const EXT_ICON = {
  pdf:'📄', docx:'📝', pptx:'📊', txt:'📃', csv:'📋',
};

let _activeFolder = null;
let _collapsedFolders = new Set();

async function loadDocs() {
  const [{ documents }, { folders }] = await Promise.all([
    _apiFetch(`${API}/documents`).then(r => r.json()),
    _apiFetch(`${API}/folders`).then(r => r.json()),
  ]);

  // Update datalist for folder suggestions
  const dl = document.getElementById('folder-suggestions');
  dl.innerHTML = folders.map(f => `<option value="${escHtml(f)}">`).join('');

  const list = document.getElementById('doc-list');
  if (!documents.length) {
    list.innerHTML = '<div style="padding:6px 16px;color:#4a4f5a;font-size:12px">No documents yet</div>';
    updateScopeBtn(folders);
    return;
  }

  // Group by folder
  const byFolder = {};
  for (const d of documents) {
    const f = d.folder || 'General';
    if (!byFolder[f]) byFolder[f] = [];
    byFolder[f].push(d);
  }

  const folderNames = Object.keys(byFolder).sort();
  let html = '';
  for (const folderName of folderNames) {
    const docs = byFolder[folderName];
    const collapsed = _collapsedFolders.has(folderName);
    const isScoped = _activeFolder === folderName;
    html += `<div class="folder-group-header ${isScoped ? 'scoped' : ''}" onclick="toggleFolder('${escHtml(folderName)}')">
      <span class="folder-toggle">${collapsed ? '▶' : '▼'}</span>
      <span class="folder-name-label" title="${escHtml(folderName)}">📁 ${escHtml(folderName)}</span>
      <span class="folder-count">${docs.length}</span>
    </div>`;
    if (!collapsed) {
      for (const d of docs) {
        const ext = d.filename.split('.').pop().toLowerCase();
        const icon = EXT_ICON[ext] || '📄';
        const safeName = escHtml(d.filename);
        const safeId = escHtml(d.doc_id);
        html += `<div class="doc-item" data-id="${safeId}">
          <span class="doc-icon">${icon}</span>
          <span class="doc-name" title="${safeName}">${safeName}</span>
          <span class="doc-chunks">${d.chunks}</span>
          <button class="doc-proc" title="Start procedure walkthrough" onclick="startProcedure('${safeId}')">▶</button>
          <button class="doc-move" title="Move to folder" onclick="moveDoc('${safeId}','${escHtml(folderName)}',this)">📁</button>
          <button class="doc-del" title="Remove" onclick="deleteDoc('${safeId}',this)">×</button>
        </div>`;
      }
    }
  }
  list.innerHTML = html;
  updateScopeBtn(folderNames);
}

function toggleFolder(name) {
  if (_collapsedFolders.has(name)) _collapsedFolders.delete(name);
  else _collapsedFolders.add(name);
  loadDocs();
}

function updateScopeBtn(folders) {
  const btn = document.getElementById('scope-btn');
  if (_activeFolder) {
    btn.textContent = _activeFolder;
    btn.classList.add('active');
  } else {
    btn.textContent = 'All folders';
    btn.classList.remove('active');
  }
}

function toggleScope() {
  // Build a quick folder list from the current doc list headers
  const headers = document.querySelectorAll('.folder-group-header .folder-name-label');
  const available = [...headers].map(h => h.title);
  if (!available.length) return;

  if (!_activeFolder) {
    _activeFolder = available[0];
  } else {
    const idx = available.indexOf(_activeFolder);
    _activeFolder = idx >= 0 && idx < available.length - 1 ? available[idx + 1] : null;
  }
  updateScopeBtn(available);
  loadDocs();
}

async function deleteDoc(docId, btn) {
  btn.disabled = true;
  await _apiFetch(`${API}/documents/${docId}`, { method: 'DELETE' });
  loadDocs();
}

async function clearAllDocs() {
  if (!confirm('Delete ALL documents from the knowledge base? This cannot be undone.')) return;
  const btn = document.getElementById('clear-all-btn');
  btn.disabled = true;
  btn.textContent = '…';
  try {
    await _apiFetch(`${API}/documents`, { method: 'DELETE' });
    loadDocs();
  } finally {
    btn.disabled = false;
    btn.textContent = 'Clear all';
  }
}

async function moveDoc(docId, currentFolder, btn) {
  const newFolder = prompt('Move to folder:', currentFolder);
  if (!newFolder || newFolder.trim() === currentFolder) return;
  btn.disabled = true;
  await _apiFetch(`${API}/documents/${docId}/folder`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ folder: newFolder.trim() }),
  });
  loadDocs();
}

loadDocs();
initNas();

// ── procedure mode ────────────────────────────────────────────────────────────
let _procState = null; // {docId, filename, stepNum, totalSteps, stepText}

async function startProcedure(docId) {
  // Find and disable the clicked button while generating
  const btn = document.querySelector(`.doc-item[data-id="${docId}"] .doc-proc`);
  if (btn) { btn.textContent = '⏳'; btn.disabled = true; }
  try {
    const resp = await _apiFetch(`${API}/procedure/session/${_currentConvId}/start`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ doc_id: docId }),
    });
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      showToast(`Procedure error: ${err.detail || resp.status}`, true);
      return;
    }
    const data = await resp.json();
    _procState = {
      docId,
      filename: data.filename,
      stepNum: data.step_num,
      totalSteps: data.total_steps,
      stepText: data.step_text,
    };
    updateProcBar();
  } catch (e) {
    showToast(`Procedure error: ${e.message}`, true);
  } finally {
    if (btn) { btn.textContent = '▶'; btn.disabled = false; }
  }
}

async function navigateStep(direction) {
  if (!_procState) return;
  const resp = await _apiFetch(`${API}/procedure/session/${_currentConvId}/navigate`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ direction }),
  });
  if (!resp.ok) return;
  const data = await resp.json();
  _procState.stepNum = data.step_num;
  _procState.totalSteps = data.total_steps;
  _procState.stepText = data.step_text;
  updateProcBar();
}

async function endProcedure() {
  if (!_procState) return;
  await _apiFetch(`${API}/procedure/session/${_currentConvId}`, { method: 'DELETE' }).catch(() => {});
  _procState = null;
  updateProcBar();
}

function updateProcBar() {
  const procBar = document.getElementById('proc-bar');
  if (!_procState) {
    procBar.classList.remove('active');
    return;
  }
  procBar.classList.add('active');
  document.getElementById('proc-title').textContent = `📋 ${_procState.filename}`;
  document.getElementById('proc-step-counter').textContent =
    `Step ${_procState.stepNum} of ${_procState.totalSteps}`;
  document.getElementById('proc-step-box').textContent = _procState.stepText;
  document.getElementById('proc-prev-btn').disabled = _procState.stepNum <= 1;
  document.getElementById('proc-next-btn').disabled = _procState.stepNum >= _procState.totalSteps;
}

// ── upload ────────────────────────────────────────────────────────────────────
const zone  = document.getElementById('upload-zone');
const input = document.getElementById('file-input');
const bar   = document.getElementById('progress-bar');
const fill  = document.getElementById('progress-fill');

let _ingestLocked = false;

function setIngestLock(locked) {
  _ingestLocked = locked;
  sendBtn.disabled = locked || !qInput.value.trim();
  qInput.placeholder = locked
    ? 'Documents are being processed — please wait…'
    : 'Ask a question about your documents…';
  zone.style.pointerEvents = locked ? 'none' : '';
  zone.style.opacity = locked ? '0.5' : '';
}

function setIngestLabel(text) { document.getElementById('ingest-label').textContent = text; }

function showToast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => { t.className = 'toast'; }, 4000);
}

zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag'); });
zone.addEventListener('dragleave', () => zone.classList.remove('drag'));
zone.addEventListener('drop', async e => {
  e.preventDefault();
  zone.classList.remove('drag');
  const items = [...e.dataTransfer.items];
  const entries = items.map(i => i.webkitGetAsEntry()).filter(Boolean);
  // If a single directory was dropped, auto-fill folder name and read its contents
  if (entries.length === 1 && entries[0].isDirectory) {
    const dirEntry = entries[0];
    const folderInput = document.getElementById('folder-input');
    if (!folderInput.value.trim()) folderInput.value = dirEntry.name;
    const files = await _readDirEntry(dirEntry);
    uploadFiles(files);
  } else {
    uploadFiles([...e.dataTransfer.files]);
  }
});
input.addEventListener('change', () => uploadFiles([...input.files]));

async function _readDirEntry(dirEntry) {
  const files = [];
  async function readEntries(reader) {
    // readEntries returns at most 100 items at a time — loop until empty
    while (true) {
      const batch = await new Promise((res, rej) => reader.readEntries(res, rej));
      if (!batch.length) break;
      for (const entry of batch) {
        if (entry.isFile) {
          const f = await new Promise((res, rej) => entry.file(res, rej));
          files.push(f);
        } else if (entry.isDirectory) {
          await readEntries(entry.createReader());
        }
      }
    }
  }
  await readEntries(dirEntry.createReader());
  return files;
}

async function uploadFiles(files) {
  if (!files.length) return;
  if (_ingestLocked) { showToast('Upload already in progress — please wait', true); return; }

  // Lock and show the bar immediately — before the upload request, not after —
  // so a second drop/select during a slow upload can't race in and start a
  // second job. Two jobs polling concurrently both write to the same shared
  // fill/bar elements, which made the bar appear to jump back to 0% at random.
  setIngestLock(true);
  bar.style.display = 'block';
  fill.style.width = '0%';
  setIngestLabel('Uploading…');

  const folder = (document.getElementById('folder-input').value || 'General').trim();
  const form = new FormData();
  files.forEach(f => form.append('files', f));
  form.append('folder', folder);

  let job;
  try {
    const r = await _apiFetch(`${API}/ingest/bulk`, { method: 'POST', body: form });
    job = await r.json();
    if (!r.ok) {
      showToast(job.detail || 'Upload failed', true);
      setIngestLock(false);
      bar.style.display = 'none'; fill.style.width = '0%'; setIngestLabel('');
      return;
    }
  } catch {
    showToast('Upload failed — backend unreachable', true);
    setIngestLock(false);
    bar.style.display = 'none'; fill.style.width = '0%'; setIngestLabel('');
    return;
  }

  input.value = '';
  fill.style.width = '0%';
  setIngestLabel(`Processing 0 / ${job.total}…`);
  pollJob(job.job_id, job.total);
}

function pollJob(jobId, total) {
  const iv = setInterval(async () => {
    try {
      const r   = await _apiFetch(`${API}/ingest/status/${jobId}`);
      if (r.status === 404) {
        clearInterval(iv);
        bar.style.display = 'none'; fill.style.width = '0%'; setIngestLabel('');
        setIngestLock(false);
        showToast('Ingest job lost — server was restarted. Please re-upload your files.', true);
        return;
      }
      const job = await r.json();

      // A NAS scan passes null: its total is only known once the server-side
      // walk finishes, so the denominator comes from the job status instead of
      // from the caller.
      const denom = total ?? job.total ?? 0;
      const pct = denom > 0 ? Math.round((job.prepared / denom) * 100) : 0;
      fill.style.width = pct + '%';
      setIngestLabel(denom ? `Processing ${job.prepared} / ${denom}…` : 'Scanning…');

      if (job.status === 'done' || job.status === 'failed') {
        clearInterval(iv);
        fill.style.width = '100%';
        setTimeout(() => { bar.style.display = 'none'; fill.style.width = '0%'; setIngestLabel(''); }, 600);
        setIngestLock(false);
        loadDocs();
        if (job.status === 'done') {
          const n = job.results.filter(r => r.status === 'ok').length;
          const skipped = job.results.filter(r => r.status === 'skipped').length;
          showToast(`${n} document${n !== 1 ? 's' : ''} ready to query` +
                    (skipped ? `, ${skipped} already indexed` : ''));
        } else {
          showToast(job.errors[0] || 'Ingest failed — see console for details', true);
          console.error('Ingest job failed', job);
        }
      }
    } catch (e) { console.error('Status poll error', e); }
  }, 1000);
}

// ── NAS scan ──────────────────────────────────────────────────────────────────
// The share root is fixed by the container's read-only bind mount, so the user
// picks a subfolder rather than typing a path — the server rejects anything that
// escapes the root anyway.
async function initNas() {
  try {
    const r = await _apiFetch(`${API}/ingest/nas/health`);
    const h = await r.json();
    if (!h.available) return;                       // no mount: stay hidden
    const sel = document.getElementById('nas-subpath');
    sel.innerHTML = '<option value="">(entire share)</option>' +
      h.subfolders.map(f => `<option value="${escHtml(f)}">${escHtml(f)}</option>`).join('');
    document.getElementById('nas-row').style.display = 'block';
  } catch { /* backend down — the upload path already surfaces that */ }
}

function toggleNasPanel() {
  const p = document.getElementById('nas-panel');
  p.style.display = p.style.display === 'block' ? 'none' : 'block';
}

async function previewNas() {
  const subpath = document.getElementById('nas-subpath').value;
  const out = document.getElementById('nas-summary');
  out.textContent = 'Scanning…';
  try {
    const r = await _apiFetch(`${API}/ingest/nas/preview`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ subpath }),
    });
    const p = await r.json();
    if (!r.ok) { out.textContent = p.detail || 'Preview failed'; return; }
    const mb = (p.total_bytes / 1048576).toFixed(1);
    out.textContent =
      `${p.new} new (${mb} MB) · ${p.unchanged} unchanged · ${p.unsupported} unsupported`;
    document.getElementById('nas-start-btn').disabled = p.new === 0;
  } catch {
    out.textContent = 'Preview failed — backend unreachable';
  }
}

async function startNasScan() {
  if (_ingestLocked) { showToast('Ingest already in progress — please wait', true); return; }
  const subpath = document.getElementById('nas-subpath').value;

  setIngestLock(true);
  bar.style.display = 'block';
  fill.style.width = '0%';
  setIngestLabel('Scanning NAS…');

  let job;
  try {
    const r = await _apiFetch(`${API}/ingest/nas/scan`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ subpath }),
    });
    job = await r.json();
    if (!r.ok) {
      showToast(job.detail || 'NAS scan failed', true);
      setIngestLock(false);
      bar.style.display = 'none'; fill.style.width = '0%'; setIngestLabel('');
      return;
    }
  } catch {
    showToast('NAS scan failed — backend unreachable', true);
    setIngestLock(false);
    bar.style.display = 'none'; fill.style.width = '0%'; setIngestLabel('');
    return;
  }

  // The walk happens server-side after this response returns, so the total is
  // not known yet — pass null and let pollJob read it from the job status.
  pollJob(job.job_id, null);
}

// ── conversation management ───────────────────────────────────────────────────
let _convs = [];
let _currentConvId = null;
let _currentMessages = [];

function loadConvs() {
  try { _convs = JSON.parse(localStorage.getItem('ga-convs') || '[]'); }
  catch { _convs = []; }
}

function persistConvs() {
  localStorage.setItem('ga-convs', JSON.stringify(_convs.slice(0, 50)));
}

function saveCurrentConv() {
  if (!_currentConvId || _currentMessages.length === 0) return;
  const idx = _convs.findIndex(c => c.id === _currentConvId);
  if (idx >= 0) {
    _convs[idx].messages  = _currentMessages;
    _convs[idx].updatedAt = Date.now();
    // Keep list sorted: move updated conv to top
    _convs.unshift(_convs.splice(idx, 1)[0]);
  } else {
    _convs.unshift({
      id: _currentConvId,
      title: _currentMessages[0]?.text?.slice(0, 55) || 'New conversation',
      createdAt: Date.now(),
      updatedAt: Date.now(),
      messages:  _currentMessages,
    });
  }
  persistConvs();
  renderConvList();
}

function newConversation() {
  saveCurrentConv();
  if (_currentConvId) {
    _apiFetch(`${API}/chat/session/${_currentConvId}`, { method: 'DELETE' }).catch(() => {});
    if (_procState) _apiFetch(`${API}/procedure/session/${_currentConvId}`, { method: 'DELETE' }).catch(() => {});
  }
  _procState = null;
  updateProcBar();
  _currentConvId   = 'sess_' + Math.random().toString(36).slice(2);
  _currentMessages = [];
  chatStarted      = false;
  msgs.innerHTML   = `<div class="empty-state"><img class="es-logo" src="/static/geocosmos_icon.png" alt="GeoCosmos"><h2>Geo-Assist</h2><p>Upload a document in the sidebar,<br>then ask a question below.</p></div>`;
  renderConvList();
}

function switchConv(id) {
  if (id === _currentConvId) return;
  saveCurrentConv();
  _procState = null;
  updateProcBar();
  const conv = _convs.find(c => c.id === id);
  if (!conv) return;
  _currentConvId   = id;
  _currentMessages = conv.messages ? [...conv.messages] : [];
  // Sync backend context window to this conversation's last turns
  const history = _currentMessages.slice(-6).map(m => ({ role: m.role, content: m.text }));
  _apiFetch(`${API}/chat/session/${id}/restore`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ messages: history }),
  }).catch(() => {});
  msgs.innerHTML   = '';
  chatStarted      = _currentMessages.length > 0;
  for (const m of _currentMessages) renderMsgRow(m.role, m.text, m.sources);
  if (!chatStarted) {
    msgs.innerHTML = `<div class="empty-state">
      <h2>Geo-Assist</h2>
      <p>Upload a document in the sidebar,<br>then ask a question below.</p>
    </div>`;
  } else {
    msgs.lastElementChild?.scrollIntoView({ block: 'end' });
  }
  renderConvList();
}

function deleteConv(id, e) {
  e.stopPropagation();
  const idx = _convs.findIndex(c => c.id === id);
  if (idx >= 0) {
    _apiFetch(`${API}/chat/session/${_convs[idx].id}`, { method: 'DELETE' }).catch(() => {});
    _convs.splice(idx, 1);
    persistConvs();
  }
  if (id === _currentConvId) {
    _convs.length > 0 ? switchConv(_convs[0].id) : newConversation();
  } else {
    renderConvList();
  }
}

function relTime(ts) {
  const s = (Date.now() - ts) / 1000;
  if (s < 60)   return 'just now';
  if (s < 3600) return `${Math.floor(s / 60)}m ago`;
  if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
  return `${Math.floor(s / 86400)}d ago`;
}

function renderConvList() {
  const list = document.getElementById('conv-list');
  if (_convs.length === 0) {
    list.innerHTML = '<div class="conv-empty">No conversations yet</div>';
    return;
  }
  list.innerHTML = _convs.map(c => `
    <div class="conv-item ${c.id === _currentConvId ? 'active' : ''}" onclick="switchConv('${c.id}')">
      <div class="conv-meta">
        <div class="conv-title" title="${escHtml(c.title)}">${escHtml(c.title)}</div>
        <div class="conv-time">${relTime(c.updatedAt || c.createdAt)}</div>
      </div>
      <button class="conv-del" onclick="deleteConv('${c.id}',event)" title="Delete">×</button>
    </div>
  `).join('');
}

// ── scroll helper ─────────────────────────────────────────────────────────────
function isNearBottom() {
  return msgs.scrollHeight - msgs.scrollTop - msgs.clientHeight < 120;
}
function scrollToBottom() {
  if (isNearBottom()) msgs.scrollTo({ top: msgs.scrollHeight, behavior: 'smooth' });
}

// ── chat ──────────────────────────────────────────────────────────────────────
const msgs    = document.getElementById('messages');
const qInput  = document.getElementById('question');
const sendBtn = document.getElementById('send-btn');
let chatStarted = false;

qInput.addEventListener('input', () => {
  qInput.style.height = 'auto';
  qInput.style.height = Math.min(qInput.scrollHeight, 140) + 'px';
  sendBtn.disabled = _ingestLocked || !qInput.value.trim();
});
qInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
});
sendBtn.addEventListener('click', sendMsg);

function renderMsgRow(role, text, sources) {
  const row   = document.createElement('div');
  row.className = `msg-row ${role}`;
  const label = role === 'user' ? 'You' : 'Geo-Assist';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  if (role === 'assistant') {
    bubble.classList.add('md');
    bubble.innerHTML = renderMarkdown(text);
  } else {
    bubble.textContent = text;
  }
  row.innerHTML = `<div class="msg-label">${label}</div>`;
  row.appendChild(bubble);
  if (sources && sources.length) {
    const div = document.createElement('div');
    div.className = 'sources';
    div.innerHTML = sources.map(renderSourceChip).join('');
    row.appendChild(div);
  }
  msgs.appendChild(row);
  return row;
}

function addMsg(role, text, sources) {
  if (!chatStarted) { msgs.innerHTML = ''; chatStarted = true; }
  const row = renderMsgRow(role, text, sources);
  row.scrollIntoView({ behavior: 'smooth', block: 'end' });
  _currentMessages.push({ role, text, sources: sources || [] });
  saveCurrentConv();
  return row;
}

function addThinking() {
  if (!chatStarted) { msgs.innerHTML = ''; chatStarted = true; }
  const row = document.createElement('div');
  row.className = 'msg-row assistant';
  row.innerHTML = `<div class="msg-label">Geo-Assist</div>
    <div class="thinking"><span></span><span></span><span></span></div>`;
  msgs.appendChild(row);
  scrollToBottom();
  return row;
}

async function sendMsg() {
  const q = qInput.value.trim();
  if (!q) return;
  qInput.value = '';
  qInput.style.height = 'auto';
  sendBtn.disabled = true;

  addMsg('user', q);
  const thinking = addThinking();

  try {
    const resp = await _apiFetch(`${API}/chat/stream`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: q, session_id: _currentConvId, folder_filter: _activeFolder }),
    });

    if (!resp.ok) {
      const err = await resp.json();
      thinking.remove();
      addMsg('assistant', `Error: ${err.detail || resp.statusText}`);
      sendBtn.disabled = false;
      qInput.focus();
      return;
    }

    let row = null, bubble = null, fullText = '', finalSources = [];
    const reader  = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = JSON.parse(line.slice(6));

        if (data.token !== undefined) {
          if (!bubble) {
            thinking.remove();
            row = document.createElement('div');
            row.className = 'msg-row assistant';
            row.innerHTML = '<div class="msg-label">Geo-Assist</div>';
            bubble = document.createElement('div');
            bubble.className = 'bubble';   // pre-wrap while streaming
            row.appendChild(bubble);
            msgs.appendChild(row);
          }
          // Append token directly — avoids O(n²) full-string rewrite
          fullText += data.token;
          bubble.textContent += data.token;
          scrollToBottom();
        }

        if (data.done) {
          if (!bubble) { thinking.remove(); }
          finalSources = data.sources || [];
          if (bubble && fullText) {
            // Replace plain-text stream with rendered markdown
            bubble.classList.add('md');
            bubble.innerHTML = renderMarkdown(fullText);
          }
          if (finalSources.length && row) {
            const div = document.createElement('div');
            div.className = 'sources';
            div.innerHTML = finalSources.map(renderSourceChip).join('');
            row.appendChild(div);
          }
        }
      }
    }

    if (!bubble) {
      thinking.remove();
      addMsg('assistant', 'No response received.');
    } else {
      _currentMessages.push({ role: 'assistant', text: fullText, sources: finalSources });
      saveCurrentConv();
    }
  } catch (e) {
    thinking.remove();
    addMsg('assistant', `Error: ${e.message}`);
  }

  sendBtn.disabled = false;
  qInput.focus();
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function renderSourceChip(s) {
  const label = `${escHtml(s.filename)}${s.page > 0 ? `, p.${s.page}` : ''}`;
  if (!s.doc_id) return `<span class="source-chip">${label}</span>`;
  const href = `/documents/${encodeURIComponent(s.doc_id)}/file${s.page > 0 ? `#page=${s.page}` : ''}`;
  return `<a class="source-chip" href="${href}" target="_blank" rel="noopener">${label}</a>`;
}

// ── init ──────────────────────────────────────────────────────────────────────
loadConvs();
_currentConvId = 'sess_' + Math.random().toString(36).slice(2);
renderConvList();
</script>
</body>
</html>
